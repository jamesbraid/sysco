[project]
name = "sysco"
plugin = "scripts/mmsc_commands_defs.py"

[rust]
out_dir = "generated/requests"

[[headers]]
file = "L1P0_DECODE.h"
prefix = "L1P0"
module = "l1_pkg0_requests"
rust_prefix = "L1P0_"
description = ["Console request codes of one ColdFire L1 firmware package.", "Codes are unique within the package."]

[[headers]]
file = "L1P1_DECODE.h"
prefix = "L1P1"
module = "l1_pkg1_requests"
rust_prefix = "L1P1_"
description = ["Console request codes of one ColdFire L1 firmware package.", "Codes are unique within the package."]

[[headers]]
file = "L1P2_DECODE.h"
prefix = "L1P2"
module = "l1_pkg2_requests"
rust_prefix = "L1P2_"
description = ["Console request codes of one ColdFire L1 firmware package.", "Codes are unique within the package."]

[[headers]]
file = "L1P3_DECODE.h"
prefix = "L1P3"
module = "l1_pkg3_requests"
rust_prefix = "L1P3_"
description = ["Console request codes of one ColdFire L1 firmware package.", "Codes are unique within the package."]

[[headers]]
file = "L1P5_DECODE.h"
prefix = "L1P5"
module = "l1_pkg5_requests"
rust_prefix = "L1P5_"
description = ["Console request codes of one ColdFire L1 firmware package.", "Codes are unique within the package."]

[[headers]]
file = "L2P_DECODE.h"
prefix = "L2P"
module = "l2_partition_requests"
rust_prefix = "L2P_"
description = ["Request codes of the L2 controller partition task image.", "Codes are unique within the image."]

[[headers]]
file = "L2R_DECODE.h"
prefix = "L2R"
module = "l2_router_requests"
rust_prefix = "L2R_"
description = ["Request codes of the L2 controller router library.", "Codes are unique within the library."]

[[headers]]
file = "MMSC_CMD_DECODE.h"
prefix = "MMSC"
module = "mmsc_commands"
rust_prefix = "MMSC_"
description = [
  "Typed command table of the multi-module system controller firmware:",
  "the dispatch position of each command word and the user authority levels.",
]

[[headers]]
file = "L1_CONSOLE_DECODE.h"
block = "ENTRY"
prefix = "L1C"
module = "l1_console"
rust_prefix = "L1C_"
register_doc = "Entry word"
description = ["Entry layout and argument kinds of the console command tables of", "the ColdFire L1 firmware."]

[[headers]]
file = "L1P0_CONSOLE_DECODE.h"
prefix = "L1P0C"
module = "l1_pkg0_console"
rust_prefix = "L1P0C_"
description = ["Position of each console command in the registered command tables", "of one ColdFire L1 firmware package."]

[[headers]]
file = "L1P1_CONSOLE_DECODE.h"
prefix = "L1P1C"
module = "l1_pkg1_console"
rust_prefix = "L1P1C_"
description = ["Position of each console command in the registered command tables", "of one ColdFire L1 firmware package."]

[[headers]]
file = "L1P2_CONSOLE_DECODE.h"
prefix = "L1P2C"
module = "l1_pkg2_console"
rust_prefix = "L1P2C_"
description = ["Position of each console command in the registered command tables", "of one ColdFire L1 firmware package."]

[[headers]]
file = "L1P3_CONSOLE_DECODE.h"
prefix = "L1P3C"
module = "l1_pkg3_console"
rust_prefix = "L1P3C_"
description = ["Position of each console command in the registered command tables", "of one ColdFire L1 firmware package."]

[[headers]]
file = "L1P5_CONSOLE_DECODE.h"
prefix = "L1P5C"
module = "l1_pkg5_console"
rust_prefix = "L1P5C_"
description = ["Position of each console command in the registered command tables", "of one ColdFire L1 firmware package."]

[[claims]]
group = "MMSC_CMD_DECODE.h"
label = "user authority levels"
doc = "docs/mmsc/commands.md"
regex = '`BASIC` (\d+), `SUPERVISOR` (\d+),\s+`SERVICE` (\d+)'
binds = [["EN", "AUTH.level", "basic", 1], ["EN", "AUTH.level", "supervisor", 2], ["EN", "AUTH.level", "service", 3]]

[[claims]]
group = "MMSC_CMD_DECODE.h"
label = "level above 999 required"
doc = "docs/mmsc/commands.md"
regex = 'level above (999) required'
binds = [["EN", "GATE.level", "above_999", 1]]

[[claims]]
group = "MMSC_CMD_DECODE.h"
label = "level above 499 required"
doc = "docs/mmsc/commands.md"
regex = 'level above (499) required'
binds = [["EN", "GATE.level", "above_499", 1]]

[[headers]]
file = "MCF5206E_DECODE.h"
prefix = "SIM"
module = "mcf5206e"
rust_prefix = "SIM_"
register_doc = "On-chip register"
description = ["On-chip registers of the ColdFire MCF5206e that the L1 firmware uses.", "Offsets are from the module base register."]

[[headers]]
file = "L1_BOARD_DECODE.h"
prefix = "L1B"
module = "l1_board"
rust_prefix = "L1B_"
description = ["Board-level bit layouts and constants of the ColdFire L1 firmware:", "expander bytes, flash commands, quad UART, clock window."]

[[headers]]
file = "MPC8XX_DECODE.h"
prefix = "M8X"
module = "mpc8xx"
rust_prefix = "M8X_"
register_doc = "Register"
description = ["Start-up values of the PowerPC communications controller on the L2", "board: machine state, clock registers, serial channel page, PCI bridge."]
