unit = "l1_link_framing"
prefix = "L1LF"
title = "frame bytes and link context constants of the ColdFire L1 node and peer links"
doc = """
Constants of the PPP-style frame that the ColdFire L1 uses on its node link (the Bedrock UART) and on
its RS-422 peer links, and the Bedrock-side register block the node link reaches. The frame bytes and
the receive check value are shared by both links. The context values (body offset, growth limit, escape
list) belong to the peer link and the node port's setup. Offsets of the node-side register block are
from the node base in the Hub special space.

Grades: the byte values and context numbers are read from the L1 image's frame and link set-up code.
The meaning given to each one is an inference unless the item says otherwise.
"""
from = "IRIX 6.5.30 l1.bin (L1 1.44.0, Origin 300 range) frame sender, peer-link set-up and node-port set-up"

[constants]
FRAME_FLAG = { value = 0x7e, grade = "established", doc = "frame delimiter on both links" }
FRAME_ESCAPE = { value = 0x7d, grade = "established", doc = "escape byte; the byte it stands for is exclusive-or'd with FRAME_ESCAPE_XOR" }
FRAME_ESCAPE_XOR = { value = 0x20, grade = "established", doc = "value XOR'd into an escaped byte" }
FRAME_CHECK_SEED = { value = 0xffff, grade = "established", doc = "start value of the 16-bit frame check; sent low byte first, complemented" }
FRAME_CHECK_RECEIVE = { value = 0xf0b8, grade = "established", doc = "check value a receiver tests for a good frame" }
PEER_ESCAPE_TX_A = { value = 0x11, grade = "inferred", doc = "on the peer link the context escapes this byte on transmit (constants established, meaning inferred)" }
PEER_ESCAPE_TX_B = { value = 0x13, grade = "inferred", doc = "on the peer link the context escapes this byte on transmit (constants established, meaning inferred)" }
PEER_BODY_OFFSET = { value = 16, grade = "established", doc = "receive body offset in bytes; read as the segment's reserved header, which is inferred" }
PEER_GROWTH_LIMIT = { value = 0x410, grade = "established", doc = "receive growth limit in bytes (1,040); with the 16-byte offset a frame carries up to 1,024 data bytes" }
NODE_BODY_CAP = { value = 256, grade = "inferred", doc = "receive body cap of the node port, in bytes, with no growth" }
NODE_PAYLOAD_MAX = { value = 128, grade = "inferred", doc = "largest payload the node port sends in one frame" }
NODE_UART_BLOCK_OFFSET = { value = 0x30000080, grade = "inferred", doc = "offset of the node-side 16550-style register block from the node base in the Hub special space; one register per 8 bytes, accessed as 64-bit loads and stores with the low byte significant" }
