unit = "l1_link_framing"
prefix = "L1LF"
title = "frame bytes and link context constants of the ColdFire L1 node and peer links"
doc = """
Constants of the PPP-style frame that the ColdFire L1 uses on its node link (the Bedrock UART) and on
its RS-422 peer links. The frame bytes and the receive check value are shared by both links. The
context values (body offset, growth limit, escape list) belong to the peer link and the node port's
setup.

Grades: the byte values and context numbers are read from the L1 image's frame and link set-up code.
The meaning given to each one is an inference unless the item says otherwise.
"""
from = "IRIX 6.5.30 l1.bin (L1 1.44.0, Origin 300 range) frame sender, peer-link set-up and node-port set-up"

[constants]
FRAME_FLAG = { value = 0x7e, from = "L1 1.44.0 package 1, frame sender 0xffe623b4 (0xffe623e4, 0xffe62436, 0xffe62444)", grade = "established", doc = "frame delimiter on both links" }
FRAME_ESCAPE = { value = 0x7d, from = "L1 1.44.0 package 1, frame sender 0xffe623b4 (0xffe623e4, 0xffe62436, 0xffe62444)", grade = "established", doc = "escape byte; the byte it stands for is exclusive-or'd with FRAME_ESCAPE_XOR" }
FRAME_ESCAPE_XOR = { value = 0x20, from = "L1 1.44.0 package 1, frame sender 0xffe623b4 (0xffe623e4, 0xffe62436, 0xffe62444)", grade = "established", doc = "value XOR'd into an escaped byte" }
FRAME_CHECK_SEED = { value = 0xffff, from = "L1 1.44.0 package 1, frame sender 0xffe623b4 (0xffe623ee), sent complemented and low byte first (0xffe624aa to 0xffe624ca)", grade = "established", doc = "start value of the 16-bit frame check; sent low byte first, complemented" }
FRAME_CHECK_RECEIVE = { value = 0xf0b8, from = "L1 1.44.0 package 1, receive check at 0xffe6276c", grade = "established", doc = "check value a receiver tests for a good frame" }
PEER_ESCAPE_TX_A = { value = 0x11, from = "L1 1.44.0 package 1, sender escape test 0xffe623fa to 0xffe62420 with the peer context set at 0xffe2e07a to 0xffe2e0b0 (escape flag argument 1, 0x0d flag argument 0; context set-up 0xffe62330)", grade = "inferred", doc = "on the peer link the context escapes this byte on transmit (constants established, meaning inferred)" }
PEER_ESCAPE_TX_B = { value = 0x13, from = "L1 1.44.0 package 1, sender escape test 0xffe623fa to 0xffe62420 with the peer context set at 0xffe2e07a to 0xffe2e0b0 (escape flag argument 1, 0x0d flag argument 0; context set-up 0xffe62330)", grade = "inferred", doc = "on the peer link the context escapes this byte on transmit (constants established, meaning inferred)" }
PEER_BODY_OFFSET = { value = 16, from = "L1 1.44.0 package 1, peer-link context set-up 0xffe2e082 to 0xffe2e086 (0x10 pushed)", grade = "established", doc = "receive body offset in bytes; read as the segment's reserved header, which is inferred" }
PEER_GROWTH_LIMIT = { value = 0x410, from = "L1 1.44.0 package 1, peer-link context set-up 0xffe2e082 (0x410 pushed)", grade = "established", doc = "receive growth limit in bytes (1,040); with the 16-byte offset a frame carries up to 1,024 data bytes" }
NODE_BODY_CAP = { value = 256, from = "L1 1.44.0 package 1, node-port context set-up 0xffe346ce to 0xffe34706 (0x100 as both buffer sizes)", grade = "inferred", doc = "receive body cap of the node port, in bytes, with no growth" }
