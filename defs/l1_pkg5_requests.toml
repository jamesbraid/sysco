unit = "l1_pkg5_requests"
prefix = "L1P5"
title = "console request codes of ColdFire L1 package 5"
doc = "Console request codes of one ColdFire L1 firmware package. Codes are unique within the package."
from = "IRIX 6.5.30 l1.bin (L1 1.44.0), ColdFire package 5 image"

[c]
legacy_header = "L1P5_DECODE.h"
legacy_guard = "L1P5_DECODE_H"

[words.CMD]
width = 32
grade = "established"

[words.CMD.fields.code]
bits = [15, 0]
grade = "established"

[words.CMD.fields.code.enums]
general_req_rack_bay = { value = 2, grade = "established", doc = "argument shape: reply 0 then rack<<6|bay; type 0x3d reports 0x23 when the slot low byte is zero; no type 0x38 case" }
general_req_rack_bay_type = { value = 3, grade = "established", doc = "argument shape: same entry as 0x0002; adds the reported type character" }
general_req_brick_serial = { value = 4, grade = "established", doc = "argument shape: reply 0 then text; types 0x2c 0x2d 0x2e 0x40 0x7d use the per-node serial routine with a second argument; minus 104 when null" }
general_req_eeprom_read = { value = 6, grade = "established", doc = "argument shape: five or more words; local type map read through its table; status 0, bytes left, then a binary field" }
general_req_eeprom_format = { value = 7, grade = "established", doc = "argument shape: two or more words; local type map read through its table; record kind, then eight more ints for kind 1 and two for kind 2" }
general_req_system_serial = { value = 8, grade = "established", doc = "argument shape: descriptor word at a fixed location else setting 0xd; reply 0 then text; minus 104 when empty" }
general_req_port_speeds = { value = 10, grade = "established", doc = "argument shape: type table sends types $,.03456789@ABCFLMOQ{} to the port-record path, others read setting 0x2a; reply 0 then two ints" }
general_req_attached_ports_1_to_4 = { value = 12, grade = "established", doc = "argument shape: reply 0 then four pairs; port-record routine returns no record for an index outside its table" }
general_req_attached_ports_5_and_10 = { value = 13, grade = "established", doc = "argument shape: reply 0 then two pairs (records 5 and 10); same fields as the Origin 300 handler" }
general_req_requesting_port = { value = 14, grade = "established", doc = "argument shape: reply 0 then the requesting link index; added type test has no effect" }
general_req_processor_masks = { value = 16, grade = "established", doc = "argument shape: slab trace added; descriptor a fixed offset and shift a fixed offset; two reply shapes by type character, one mask pair for the requesting port or all pairs" }
general_req_scan_record = { value = 17, grade = "established", doc = "argument shape: reply 0 then a 64-byte binary field or minus 106; relocation of the Origin 300 body" }
general_req_type_char = { value = 19, grade = "established", doc = "argument shape: reply 0, int 0, then the brick-type character as an int" }
general_req_write_debug_switches = { value = 4097, grade = "established", doc = "argument shape: one int; writes setting 3 through a different setting writer; reply 0" }
general_req_display_line_1 = { value = 4100, grade = "established", doc = "argument shape: one text; display write; minus 102 if not text; same stream as the Origin 300 handler" }
general_req_display_line_2 = { value = 4101, grade = "established", doc = "argument shape: same entry as 0x1004" }
general_req_partition_set = { value = 4102, grade = "inferred", doc = "argument shape: one int; writes setting 0xe then a 320-byte update routine that was not read; reply 0" }
general_req_event_subchannel_set = { value = 4103, grade = "established", doc = "argument shape: one int; stores tag and sender<<16 at +8 of its state block, traces to the console, writes setting 0x13; reply 0" }
general_req_two_bit_setting_set = { value = 4104, grade = "established", doc = "argument shape: one int; writes setting 0x12; reply 0" }
general_req_panel_control = { value = 4105, grade = "established", doc = "argument shape: two ints; selector 0 to 2 else minus 105; reply 0; same stream as the Origin 300 handler" }
general_req_event_subchannel_clear = { value = 4106, grade = "established", doc = "argument shape: no reply; clears and unpersists the event subchannel" }
general_req_prom_version_report = { value = 4107, grade = "established", doc = "argument shape: exactly three ints; as package 3 but the line is printed only with the trace flag and the slot setter result is not tested; no reply on success" }
general_req_per_processor_setting = { value = 4108, grade = "established", doc = "argument shape: exactly two ints; per-processor setter takes three arguments, the first zero; setter body not read; no reply on success" }
general_req_system_reset = { value = 8193, grade = "established", doc = "argument shape: no reply on success; calls the hook word at a fixed location with reason 6" }
general_req_pci_operation_a = { value = 8194, grade = "established", doc = "argument shape: three or more words; hook at offset 8 of block a fixed address with three arguments; reply is the hook result" }
general_req_pci_operation_b = { value = 8195, grade = "established", doc = "argument shape: three or more words; hook at offset 0xc of block a fixed address; minus 106 on failure" }
general_req_pci_operation_c = { value = 8196, grade = "established", doc = "argument shape: three or more words; hook at offset 0x10 of block a fixed address; minus 106 on failure" }
general_req_power_down = { value = 8197, grade = "established", doc = "argument shape: no reply on success; calls the hook word at a fixed location with reason 6; minus 106 on failure" }
general_req_lifecycle_third_action = { value = 8198, grade = "established", doc = "argument shape: no reply on success; third action with reason 6; minus 106 on failure and no integer reply" }
general_req_set_clock = { value = 8205, grade = "established", doc = "argument shape: seven or more words; builds and runs a date -u / hwclock -u line from arguments 1 to 6" }
general_req_get_clock = { value = 8206, grade = "established", doc = "argument shape: reply 0 then year, month, day, hour, minute, second as ints" }
general_req_hook_3001 = { value = 12289, grade = "established", doc = "argument shape: three or more words; twelve listed brick types; calls the memory-record routine at ffe7f3b8 directly with (0, arg1, arg2, 0); minus 106 when the result is negative" }
general_req_fru_3002 = { value = 12290, grade = "established", doc = "argument shape: calls the FRU hook word at a fixed location with the frame sender word and replies its result as the status" }
general_req_fru_3003 = { value = 12291, grade = "established", doc = "argument shape: reply 0 then calls the FRU hook word at a fixed location" }
general_req_fru_3004 = { value = 12292, grade = "established", doc = "argument shape: reply 0 then passes the reply buffer to the hook word at a fixed location; its result becomes the reply count" }
general_req_inventory = { value = 16384, grade = "established", doc = "argument shape: reply 0 then one text field per record; no JEDEC format; record count from two routines" }
general_req_war_flag = { value = 16385, grade = "established", doc = "argument shape: reply 0 then the SHUB workaround flag byte as an int" }
general_req_controller_reboot = { value = 16386, grade = "established", doc = "argument shape: no reply; logs and restarts the controller" }
general_req_dimm_text = { value = 16388, grade = "established", doc = "argument shape: per-record text with JEDEC,OKAY / NOT_PRESENT / ERROR; text layout read in full, field names are a hint" }
