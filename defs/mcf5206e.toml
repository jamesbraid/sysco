unit = "mcf5206e"
prefix = "SIM"
title = "on-chip registers of the ColdFire MCF5206e as the L1 firmware uses them"
doc = """
On-chip registers of the ColdFire MCF5206e that the L1 firmware uses. Offsets are from the
module base register and are given as constants; the registers are not modelled as a register
block. Only registers the L1 firmware touches are listed. Widths marked inferred follow the chip
manual's layout because the firmware access size was not separately read. The reset values are
not stated by any image, so they are unknown. Established means the firmware writes or tests the
register as stated; inferred means the layout is the public manual's and was not re-read in an
image.
"""
from = "IRIX 6.5.30 l1.bin (L1 1.44.0) start-up code; MCF5206e manual layouts where graded inferred"

[c]
legacy_header = "MCF5206E_DECODE.h"
legacy_guard = "MCF5206E_DECODE_H"

[words.CSMR0]
width = 32
doc = """
The firmware sizes the CS0 flash by writing the mask for 2 MB, then rewrites it
for 1 MB when the two halves of the window read back the same."""
grade = "established"

[words.CSMR0.fields.bam]
bits = [31, 16]
grade = "established"

[words.CSMR0.fields.bam.enums]
size_1mb = { value = 15, grade = "established" }
size_2mb = { value = 31, grade = "established" }

[[words.CSMR0.tests]]
value = 0xf0000
expect = { bam = 15 }

[[words.CSMR0.tests]]
value = 0x1f0000
expect = { bam = 31 }

[words.CSMR2]
width = 32
doc = """
Chip-select 1 (battery-backed RAM and clock, 8-bit) and chip-select 2 (external RAM,
16-bit) values the board set-up writes. The RAM mask is cut from 512 KB to 128 KB when
the firmware's alias probe fails. The port-size decode of each control value is the
manual's and was not re-read in an image."""
grade = "established"

[words.CSMR2.fields.bam]
bits = [31, 16]
grade = "established"

[words.CSMR2.fields.bam.enums]
size_128kb = { value = 1, grade = "established" }
size_512kb = { value = 7, grade = "established" }

[[words.CSMR2.tests]]
value = 0x10000
expect = { bam = 1 }

[[words.CSMR2.tests]]
value = 0x70000
expect = { bam = 7 }

[words.MBSR]
width = 32
doc = """
M-Bus module. The offsets are the manual's, as the firmware adds them to the module base."""
grade = "established"

[words.MBSR.fields]
bus_busy = { bits = [5, 5], grade = "established" }

[words.PADAT]
width = 32
doc = """
Parallel port: direction and data, used as the scan-chain interface."""
grade = "established"

[words.PADAT.fields]
tdi = { bits = [7, 7], grade = "established" }
tck = { bits = [6, 6], grade = "established" }
tms = { bits = [5, 5], grade = "established" }
trst = { bits = [4, 4], grade = "established" }
psi = { bits = [3, 3], grade = "established" }
tdo = { bits = [0, 0], grade = "established" }

[words.PAR]
width = 32
doc = """
Pin assignment: bit 7 is pulsed by the timer set-up, bits 5:4 are cleared by the scan set-up."""
grade = "established"

[words.PAR.fields]
timer_pulse = { bits = [7, 7], grade = "established" }
scan_sel = { bits = [5, 4], grade = "established" }

[words.RSR]
width = 32
doc = """
Reset status: one bit is tested at start-up to record the reset cause."""
grade = "established"

[words.RSR.fields]
cause5 = { bits = [5, 5], grade = "established" }

[words.SYPCR]
width = 32
doc = """
Software watchdog control: write-once, armed once by the firmware."""
grade = "established"

[words.SYPCR.fields]
swe = { bits = [7, 7], grade = "established" }

[[words.SYPCR.tests]]
value = 0xfe
expect = { swe = 1 }

