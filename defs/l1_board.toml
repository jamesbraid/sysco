unit = "l1_board"
prefix = "L1B"
title = "board-level bit layouts and constants of the ColdFire L1 firmware"
doc = """
Board-level bit layouts and constants of the ColdFire L1 firmware: bit positions of the I/O
expander bytes the L1 drives, the flash command stream, the quad UART, the battery-backed clock
window and the hardware monitor start-up values. Window offsets are relative to the base of the
device's chip select. Expander addresses come in the 8-bit wire form and the 7-bit form. Each
field carries the grade of the reading; polarity grades are given separately where the firmware
only shows that a bit is written.
"""
from = "IRIX 6.5.30 l1.bin (L1 1.44.0) board set-up code"

[c]
legacy_header = "L1_BOARD_DECODE.h"
legacy_guard = "L1_BOARD_DECODE_H"

[words.CACR]
width = 32
doc = """
Control-register codes of the MOVEC extension word and the values the firmware writes
at start-up. The register names are the manual's. Instruction cache control is written
twice: invalidate, then enable."""
grade = "inferred"

[words.CACR.fields]
cenb = { bits = [31, 31], grade = "inferred" }
cinv = { bits = [24, 24], grade = "inferred" }

[words.CLOCK]
width = 32
doc = """
Battery-backed clock: control byte at the top of the window; BCD time bytes follow it."""
grade = "established"

[words.CLOCK.fields]
write_enable = { bits = [7, 7], grade = "established" }
read_latch = { bits = [6, 6], grade = "established" }
century_tens = { bits = [5, 4], grade = "established" }
century_hundreds = { bits = [3, 0], grade = "established" }

[words.CNTL1]
width = 32
doc = """
Processor-module control expanders, wire addresses 0x42 and 0x44 (7-bit 0x21 and 0x22)."""
grade = "established"

[words.CNTL1.fields]
soft_reset = { bits = [7, 7], grade = "established", doc = "Soft-reset line: idle low, set then cleared by the soft-reset command (polarity inferred)." }
nmi = { bits = [6, 6], grade = "established", doc = "Non-maskable-interrupt line: idle high, driven low then high by the nmi command (polarity inferred)." }
reset_b = { bits = [1, 1], grade = "established" }
reset_a = { bits = [0, 0], grade = "established" }

[words.CNTL2]
width = 32
grade = "unknown"

[words.CNTL2.fields]
strap = { bits = [7, 3], grade = "unknown", doc = "Strap or configuration bits written once per release; what they select is unknown." }
reset_c = { bits = [0, 0], grade = "established" }

[words.DISPLAY]
width = 32
doc = """
Front-panel expander: 7-bit address 0x20, low nibble input."""
grade = "established"

[words.DISPLAY.fields]
led_6 = { bits = [6, 6], grade = "established" }
led_5 = { bits = [5, 5], grade = "established" }
led_4 = { bits = [4, 4], grade = "established" }

[words.FLASH_STATUS]
width = 32
grade = "established"

[words.FLASH_STATUS.fields]
toggle = { bits = [6, 6], grade = "established" }
timeout = { bits = [5, 5], grade = "established", doc = "Completion is read by comparing two successive halfword reads." }

[words.PIMM_VCC]
width = 32
doc = """
Processor-module supply-good expanders: one per module, at the wire address of the first
control expander but on its own bus segment (segment 4 for module 0, segment 5 for module 1).
Reset hold sets both bits of the field; release clears both. The mask is not applied to
the written byte as an input mask."""
grade = "established"

[words.PIMM_VCC.fields]
ok = { bits = [7, 6], grade = "established" }

[words.ROUTER]
width = 32
doc = """
R-brick router expanders."""
grade = "established"

[words.ROUTER.fields]
router_type = { bits = [7, 4], grade = "established" }

[words.ROUTER_DEST]
width = 32
doc = """
Router packet destination word, as the L2 router and the L1 target list both build and
read it for brick-directed packets (any destination form other than the L2 form and the
node form): the rack takes 10 bits and the slot 6."""
grade = "established"

[words.ROUTER_DEST.fields]
rack = { bits = [27, 18], grade = "established" }
slot = { bits = [17, 12], grade = "established" }

[words.RPOWER]
width = 32
grade = "established"

[words.RPOWER.fields]
router_power = { bits = [3, 3], grade = "established" }

[words.XBRIDGE]
width = 32
doc = """
I-brick bridge control expander: expander index 5, 7-bit address 0x24."""
grade = "established"

[words.XBRIDGE.fields]
clock_select = { bits = [5, 5], grade = "established" }
host_enable_b = { bits = [4, 4], grade = "established" }
reset_3 = { bits = [3, 3], grade = "established" }
host_enable_a = { bits = [2, 2], grade = "established" }
reset_1 = { bits = [1, 1], grade = "established" }
reset_0 = { bits = [0, 0], grade = "established" }

