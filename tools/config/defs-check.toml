[[claims]]
group = "MMSC_CMD_DECODE.h"
label = "user authority levels"
doc = "docs/mmsc/commands.md"
regex = '`BASIC` (\d+), `SUPERVISOR` (\d+),\s+`SERVICE` (\d+)'
binds = [
  ["EN", "AUTH.level", "basic", 1],
  ["EN", "AUTH.level", "supervisor", 2],
  ["EN", "AUTH.level", "service", 3],
]

[[claims]]
group = "MMSC_CMD_DECODE.h"
label = "level above 999 required"
doc = "docs/mmsc/commands.md"
regex = "level above (999) required"
binds = [
  ["EN", "GATE.level", "above_999", 1],
]

[[claims]]
group = "MMSC_CMD_DECODE.h"
label = "level above 499 required"
doc = "docs/mmsc/commands.md"
regex = "level above (499) required"
binds = [
  ["EN", "GATE.level", "above_499", 1],
]
