access = "rw"
width = 32
grade = "established"
space = "mpc8xx_upm"

[words.MSR]
width = 32
doc = """
Machine state register written once by the reset code: machine-check enable and
recoverable-interrupt set, translation off, supervisor mode. The bit positions are
the PowerPC architecture's."""
grade = "inferred"

[words.MSR.fields]
me = { bits = [12, 12], grade = "inferred" }
ri = { bits = [1, 1], grade = "inferred" }

[[words.MSR.tests]]
value = 0x1002
expect = { ri = 1, me = 1 }

[words.PCI_CFG_ADDR]
width = 32
grade = "inferred"

[words.PCI_CFG_ADDR.fields]
bus = { bits = [23, 16], grade = "inferred" }
devfn = { bits = [15, 8], grade = "inferred" }
register = { bits = [7, 2], grade = "established" }
type1 = { bits = [0, 0], grade = "established" }

