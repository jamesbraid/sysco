unit = "elsc_nvram"
prefix = "ELSCNV"
title = "configuration block of the module controller's non-volatile store"
doc = """
Byte addresses inside block 7 (0x700 to 0x7ff) of the module system controller's non-volatile
store, the controller-reserved part that the host-side request set reaches. The marker byte at
0x700 and the module number at 0x708 are already read from the host driver (formats/elsc_host/format.toml);
the offsets here are the other bytes of the block as published in the public Linux SN driver
history. None of them is confirmed against a shipped image yet.
"""
from = "public Linux 2.5.0 SN controller driver (arch/ia64/sn/io/l1_command.c); IP27 PROM Technical Reference 108-0170-001, printed page 4-22; no image address recorded"

[constants]
CFG_PASSWORD = { value = 0x701, grade = "inferred", doc = "first of four bytes holding the controller password; default text none" }
CFG_PASSWORD_LEN = { value = 0x4, grade = "inferred", doc = "password length in bytes" }
CFG_SWITCH_VIRTUAL_XOR = { value = 0x705, grade = "inferred", doc = "virtual debug-switch XOR override" }
CFG_SWITCH_PHYSICAL_XOR = { value = 0x706, grade = "inferred", doc = "physical debug-switch XOR override" }
CFG_CONTROLLER = { value = 0x707, grade = "inferred", doc = "controller configuration byte; bit 0 holds the fans high, bit 1 enables automatic power-up" }
CFG_CONTROLLER_FANS_HIGH_BIT = { value = 0x0, grade = "inferred", doc = "bit index of the fans-held-high flag in CFG_CONTROLLER" }
CFG_CONTROLLER_AUTO_POWER_BIT = { value = 0x1, grade = "inferred", doc = "bit index of the automatic power-up flag in CFG_CONTROLLER" }
CFG_SELFTEST = { value = 0x709, grade = "inferred", doc = "self-test flags, two bits per node board" }
CFG_PARTITION = { value = 0x70a, grade = "inferred", doc = "partition number" }
CFG_DOMAIN = { value = 0x70b, grade = "inferred", doc = "domain number; a clock-select default may be written here by the controller's own initialization, and the meaning of that value is unsettled" }
CFG_CLUSTER = { value = 0x70c, grade = "inferred", doc = "cluster number" }
CFG_CELL = { value = 0x70d, grade = "inferred", doc = "cell number" }
CFG_RESERVED_FIRST = { value = 0x70e, grade = "inferred", doc = "first controller-reserved byte with no published use; ends at 0x7ff" }
