unit = "elsc_nvram"
prefix = "ELSCNV"
title = "configuration block of the module controller's non-volatile store"
doc = """
Byte addresses inside block 7 (0x700 to 0x7ff) of the module system controller's non-volatile
store, the controller-reserved part that the host-side request set reaches. The marker byte at
0x700 and the module number at 0x708 are already read from the host driver (formats/elsc_host/format.toml);
the offsets here are the other bytes of the block as the public Linux 2.5.0 SN driver names them,
checked against that source. None of them is confirmed against a shipped image yet.
"""
from = "Linux 2.5.0 arch/ia64/sn/io/l1_command.c, NVRAM_* definitions; IP27 PROM Technical Reference 108-0170-001, printed page 4-22 (NVRAM addresses 1792 to 2047 reserved for the system controller); no image address recorded"

[constants]
CFG_PASSWORD = { value = 0x701, grade = "inferred", doc = "first of four bytes holding the controller password; default text none" }
CFG_PASSWORD_LEN = { value = 0x4, grade = "inferred", doc = "password length in bytes" }
CFG_SWITCH_VIRTUAL_XOR = { value = 0x705, grade = "inferred", doc = "virtual debug-switch XOR override" }
CFG_SWITCH_PHYSICAL_XOR = { value = 0x706, grade = "inferred", doc = "physical debug-switch XOR override" }
CFG_CONTROLLER = { value = 0x707, grade = "inferred", doc = "controller configuration byte (the driver names it, 'ELSC Configuration info', and uses no bits); the meaning of its bits is unknown" }
CFG_SELFTEST = { value = 0x709, grade = "inferred", doc = "self-test flags, two bits per node board" }
CFG_PARTITION = { value = 0x70a, grade = "inferred", doc = "partition number" }
CFG_DOMAIN = { value = 0x70b, grade = "inferred", doc = "domain number" }
CFG_CLUSTER = { value = 0x70c, grade = "inferred", doc = "cluster number" }
CFG_CELL = { value = 0x70d, grade = "inferred", doc = "cell number" }
CFG_RESERVED_FIRST = { value = 0x70e, grade = "inferred", doc = "first byte after the last offset the driver names; the manual reserves addresses 0x700 to 0x7ff for the controller" }
